# No secrets engines or AppRoles: only what needs shares or the initial
# root token is declared here. Operators add the rest with the vault CLI.

# By IP, not hostname: DNS may depend on secrets held here, so this cluster
# must come up before DNS does.
nodes:
  - name: foundation-vault-0
    ip: 10.0.40.10
  - name: foundation-vault-1
    ip: 10.0.40.11
  - name: foundation-vault-2
    ip: 10.0.40.12

threshold: 3
holders:
  - alice
  - bob
  - carol
  - safe-hq
  - safe-dc2

root_token_holder: alice

operators:
  - name: alice
    policies: [admin]
  - name: bob
    policies: [admin]
  - name: carol
    policies: [admin]

# Not left for operators to enable: bootstrap enables it first, so that
# everything after it is recorded. One file device is not enough in
# production, where the log must also leave the cluster, for example:
#   - path: syslog
#     type: syslog
#     options: {tag: vault, facility: AUTH}
audit:
  - path: file
    type: file
    options:
      file_path: /var/log/vault/audit.log
