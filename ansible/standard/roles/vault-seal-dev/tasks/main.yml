---
# The binary itself, not an archive: the release publishes it as is, so it
# is placed without unpacking.
- name: Ensure vault-seal-dev binary is installed
  ansible.builtin.get_url:
    url: "https://github.com/zinrai/vault-seal-dev/releases/download/v{{ vault_seal_dev.version }}/vault-seal-dev_{{ vault_seal_dev.version }}_linux_amd64"
    checksum: "sha256:https://github.com/zinrai/vault-seal-dev/releases/download/v{{ vault_seal_dev.version }}/vault-seal-dev_{{ vault_seal_dev.version }}_checksums.txt"
    dest: "{{ vault_seal_dev.bin }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - vault-seal-dev

# Its own user, not vault: the seal reads the key, Vault only asks the seal.
- name: Ensure vault-seal-dev user exists
  ansible.builtin.user:
    name: vault-seal-dev
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  tags:
    - vault-seal-dev
