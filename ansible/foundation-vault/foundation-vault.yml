---
# All nodes at once, not serial: 1: nothing here restarts Vault, so the
# Raft quorum is never at stake.
- hosts: foundation_vault
  become: true
  roles:
    - apt_update
    - ca-certificates
    - apt_hashicorp_repository
    - logrotate
    - vault_conf
    - vault_enable

- hosts: foundation_vault_lb
  become: true
  roles:
    - apt_update
    - haproxy_conf
